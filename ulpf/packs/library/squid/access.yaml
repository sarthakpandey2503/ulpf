id: squid.access
version: "1.0"
vendor: Squid
product: Squid Proxy
category: proxy
description: Squid native access.log format.
priority: 55
match:
  regex: '^\d{9,10}\.\d{3}\s+\d+ \S+ [A-Z_]+/\d{3} '
parse:
  - type: grok
    pattern: '^%{NUMBER:ts}\s+%{INT:elapsed_ms} %{IP:client_ip} %{WORD:cache_result}/%{INT:status} %{INT:bytes} %{WORD:method} %{NOTSPACE:url} %{NOTSPACE:user} %{WORD:hierarchy}/%{NOTSPACE:server} %{NOTSPACE:content_type}'
mapping:
  time: {field: ts, cast: timestamp}
  device.type_id: {const: 0}
  src_endpoint.ip: client_ip
  dst_endpoint.ip: {field: server, cast: ip}
  dst_endpoint.hostname: {field: url, regex: '^(?:[a-z]+://)?(?P<v>[^/:]+)'}
  http_request.http_method: method
  http_request.url.url_string: url
  http_request.url.hostname: {field: url, regex: '^(?:[a-z]+://)?(?P<v>[^/:]+)'}
  http_response.code: status
  http_response.content_type: {field: content_type, map: {"-": null}, map_default_passthrough: true}
  traffic.bytes_in: bytes
  duration: elapsed_ms
  actor.user.name: user
  disposition_id: {field: cache_result, regex: '(?P<v>DENIED)', map: {denied: 2}, default: 1}
  action_id: {field: cache_result, regex: '(?P<v>DENIED)', map: {denied: 2}, default: 1}
classes:
  - name: access
    class: http_activity
    activity_id: {field: method, map: {connect: 1, delete: 2, get: 3, head: 4, options: 5, post: 6, put: 7, trace: 8}, default: 99}
